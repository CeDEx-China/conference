- name: Professor Susan Feng Lu
  title: "Professor & Alan Hudson Chair in Health Policy, Rotman School of Management, University of Toronto; President of the Chinese Economists Society"
  bio: Research spans health economics, operations management, and data analytics. Published in Management Science, MSOM, Review of Economics and Statistics.
  photo: susan-feng-lu.png

- name: Professor Lizheng Shi
  title: "Endowed Chair & Founding Director of HSARC, Tulane University; Co-Editor-in-Chief of PharmacoEconomics & Policy"
  bio: Internationally recognized in health economics, pharmaceutical policy, and health technology assessment. Over 300 publications and 40+ research projects.
  photo: lizheng-shi.jpg

- name: Professor M. Mahmud Khan
  title: "John A. Drew Professor & Department Head, Health Policy and Management, University of Georgia"
  bio: Expertise in health financing, global health economics, and economic evaluation of health programs across 40+ countries.
  photo: mahmud-khan.png

- name: Professor Liang Wang
  title: "Full Professor & Director, Global Health Institute, Marshall University; Past President of CHPAMS"
  bio: Research focuses on global health policy, nutritional epidemiology, and health inequality. Fellow of the American Epidemiological Society.
  photo: liang-wang.png

- name: Dr Xi Chen
  title: "Associate Professor of Public Health (Health Policy) & Economics, Yale University; NBER Research Associate; Past President of CHPAMS"
  bio: Research on economics and public policy of population aging, behavioral economics, and global health systems. Top 1% economist on RePEc.
  photo: xi-chen.jpg

- name: Dr Changle Li
  title: "Associate Professor & Chair, Health Policy and Management, Fujian Medical University"
  bio: Research covers healthcare reform, health policy analysis, and health system performance, with a focus on China's aging population and public satisfaction with healthcare reform.
  photo: changle-li.png

- name: Dr Huiwen Xu
  title: "Tenured Associate Professor, Emory University; President of CHPAMS"
  bio: NIA-funded research on long-term care, health inequality, and healthcare access for vulnerable populations. Published in The Lancet, JAMA Internal Medicine, Health Affairs.
  photo: huiwen-xu.jpg

- name: Dr Wenkai Li
  title: "Beijing Office Director & Chief Representative in China, China Medical Board (CMB) Foundation"
  bio: Extensive experience in international health cooperation, medical education development, and health policy programs.
  photo: wenkai-li.jpg

- name: Professor Jie Pan
  title: "Professor & Executive Vice Dean, West China School of Public Health, Sichuan University"
  bio: Long-standing research in health policy, health economics, and health statistics. Published in The Lancet and leading Chinese journals.
  photo: jie-pan.jpg

- name: Professor Siripen Supakankunti
  title: "Professor, Faculty of Economics & former Director of the Centre for Health Economics (WHO Collaborating Centre), Chulalongkorn University"
  bio: Widely recognized in health economics, pharmaceutical policy, health financing, and health system development across Asia and globally.
  photo: siripen-supakankunti.jpg
